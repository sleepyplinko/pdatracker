<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDA.exe — Once A Normal City Tracker</title>
  <meta name="description" content="Fan-made tracker for which PDA entries you've found in Once A Normal City.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@50..200,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="pda" id="pda">
    <header class="titlebar">
      <span class="title">PDA.exe</span>
      <span class="hint">&lt; SCROLL TABS FOR MORE OPTIONS &gt;</span>
      <span class="count" id="titleCount"></span>
    </header>

    <div class="banner" id="banner" hidden></div>
    <div class="window">
    <nav class="tabs" id="tabs" aria-label="PDA sections"></nav>

    <div class="searchbar">
      <span class="sicon" id="searchIcon" aria-hidden="true"></span>
      <input id="search" type="search" placeholder="SEARCH WEAPONS, PEOPLE, DOCUMENTS…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search the PDA">
      <button class="clear-search" id="clearSearch" hidden aria-label="Clear search">CLEAR</button>
      <div class="viewtools" role="toolbar" aria-label="View options">
        <button data-view="grid" title="Grid view (like the game)">&#9638;</button>
        <button data-view="list" title="Checklist view">&#9776;</button>
        <span class="vsep"></span>
        <button data-filter="all" title="Show everything">ALL</button>
        <button data-filter="missing" title="Show only what you haven't found">MISSING</button>
        <button data-filter="found" title="Show only what you've found">FOUND</button>
      </div>
    </div>

    <section class="screen" id="screen" aria-live="polite"></section>
    </div>
  </main>

  <p class="footer">Fan-made tracker, not affiliated with edwardd studios yeah. Progress is saved in this browser.</p>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="sounds.js"></script>
  <script src="data.js"></script>
  <script src="descriptions.js"></script>
  <script src="tooltips.js"></script>
  <script src="app.js"></script>
</body>
</html>

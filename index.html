<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDA.exe — Once A Normal City Tracker</title>
  <meta name="description" content="Fan-made tracker for which PDA entries you've found in Once A Normal City.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@50..200,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="pda" id="pda">
    <header class="titlebar">
      <span class="title">PDA.exe</span>
      <span class="hint">&lt; SCROLL TABS FOR MORE OPTIONS &gt;</span>
      <span class="count" id="titleCount"></span>
    </header>

    <div class="banner" id="banner" hidden></div>
    <div class="backupbar" id="backupbar" hidden></div>
    <div class="window">
    <nav class="tabs" id="tabs" aria-label="Checklist sections"></nav>

    <div class="searchbar">
      <span class="sicon" id="searchIcon" aria-hidden="true"></span>
      <input id="search" type="search" placeholder="SEARCH · ENTER = MARK FOUND" title="Type to search. ENTER marks the top match as found, SHIFT+ENTER opens it. Press / to jump here." autocomplete="off" spellcheck="false" aria-label="Search the PDA">
      <button class="clear-search" id="clearSearch" hidden aria-label="Clear search">CLEAR</button>
      <div class="viewtools" role="toolbar" aria-label="View options">
        <button data-view="grid" title="Grid view (like the game)">&#9638;</button>
        <button data-view="list" title="Checklist view">&#9776;</button>
        <button data-compact title="Compact grid (fit more on screen)">&#9641;</button>
        <button data-hidedone title="Hide finished tiers, tabs and categories">HIDE DONE</button>
        <select id="sortSel" title="Sort order" aria-label="Sort order">
          <option value="found">FOUND FIRST</option>
          <option value="az">A&ndash;Z</option>
          <option value="recent">RECENTLY FOUND</option>
        </select>
        <span class="vsep"></span>
        <button data-filter="all" title="Show everything">ALL</button>
        <button data-filter="missing" title="Show only what you haven't found">MISSING</button>
        <button data-filter="found" title="Show only what you've found">FOUND</button>
      </div>
    </div>

    <section class="screen" id="screen" aria-live="polite"></section>
    <nav class="tabs bottom" id="tabs2" aria-label="Profile and options"></nav>
    </div>
  </main>

  <p class="footer">Fan-made tracker, not affiliated with edwardd studios yeah. Progress is saved in this browser.</p>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="sounds.js"></script>
  <script src="data.js"></script>
  <script src="descriptions.js"></script>
  <script src="tooltips.js"></script>
  <script src="ammo-links.js"></script>
  <script src="ammo.js"></script>
  <script src="changelog.js"></script>
  <script src="contribute.js"></script>
  <script src="cloud-config.js"></script>
  <script src="app.js"></script>
  <script>
    // installable app + offline: only on the real site (https), not when opened as a file
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
